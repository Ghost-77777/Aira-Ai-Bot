<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aira AI</title>
  <style>
    * {
      box-sizing: border-box;
    }
    :root {
      --bg: #0b0d12;
      --sidebar: #10131a;
      --card: #171a22;
      --border: rgba(255,255,255,0.08);
      --text: #f4f4f5;
      --muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #5558e8;
      --user: #4f46e5;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    /* APP */
    .app {
      height: 100vh;
      display: flex;
    }
    /* SIDEBAR */
    .sidebar {
      width: 250px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 25px;
    }
    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      font-size: 20px;
    }
    .new-chat {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #171a22;
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .new-chat:hover {
      background: #1d212b;
    }
    .sidebar-title {
      margin-top: 25px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .sidebar-item {
      padding: 10px;
      border-radius: 8px;
      color: #d1d5db;
      font-size: 14px;
    }
    .sidebar-bottom {
      margin-top: auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .topbar {
      height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(11,13,18,0.9);
    }
    .assistant-name {
      font-weight: 600;
      font-size: 16px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #a1a1aa;
      font-size: 12px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34,197,94,0.6);
    }
    /* CHAT */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px 140px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar {
      width: 7px;
    }
    .messages::-webkit-scrollbar-thumb {
      background: #272b35;
      border-radius: 10px;
    }
    .welcome {
      height: 100%;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .welcome-content {
      max-width: 500px;
    }
    .welcome-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      font-size: 34px;
      box-shadow: 0 10px 35px rgba(99,102,241,0.25);
    }
    .welcome h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }
    .welcome p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .message-row {
      display: flex;
      margin-bottom: 25px;
      gap: 12px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    .message-row.user {
      justify-content: flex-end;
    }
    .avatar {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: #1f2430;
    }
    .message-row.user .avatar {
      order: 2;
      background: var(--user);
    }
    .bubble {
      max-width: min(75%, 720px);
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message-row.ai .bubble {
      background: #171a22;
      border: 1px solid var(--border);
      border-top-left-radius: 5px;
    }
    .message-row.user .bubble {
      background: var(--user);
      border-top-right-radius: 5px;
    }
    /* TYPING */
    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 5px 2px;
    }
    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9ca3af;
      animation: typing 1.2s infinite;
    }
    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }
    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }
    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }
    /* INPUT */
    .input-wrapper {
      position: fixed;
      bottom: 0;
      right: 0;
      left: 250px;
      padding: 20px 20px 24px;
      background: linear-gradient(
        transparent,
        var(--bg) 35%
      );
    }
    .input-container {
      max-width: 900px;
      margin: auto;
      position: relative;
      display: flex;
      align-items: center;
      background: #171a22;
      border: 1px solid #292e39;
      border-radius: 16px;
      padding: 7px;
      transition: 0.2s;
    }
    .input-container:focus-within {
      border-color: rgba(99,102,241,0.7);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 13px 14px;
      min-width: 0;
    }
    input::placeholder {
      color: #717784;
    }
    .send-button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .send-button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .send-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .disclaimer {
      text-align: center;
      color: #626875;
      font-size: 11px;
      margin-top: 8px;
    }
    /* MOBILE */
    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }
      .topbar {
        padding: 0 16px;
      }
      .input-wrapper {
        left: 0;
        padding: 14px 12px 18px;
      }
      .messages {
        padding: 25px 12px 130px;
      }
      .bubble {
        max-width: 85%;
        font-size: 14px;
      }
      .welcome h1 {
        font-size: 25px;
      }
      .welcome p {
        padding: 0 20px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">✦</div>
        Aira AI
      </div>
      <button class="new-chat" id="newChat">
        ＋ New Chat
      </button>
      <div class="sidebar-title">
        Assistant
      </div>
      <div class="sidebar-item">
        🤖 General AI
      </div>
      <div class="sidebar-bottom">
        Powered by Groq<br>
        Aira AI Assistant
      </div>
    </aside>
    <!-- MAIN -->
    <main class="main">
      <header class="topbar">
        <div class="assistant-name">
          Aira AI
        </div>
        <div class="status">
          <span class="status-dot"></span>
          Online
        </div>
      </header>
      <!-- MESSAGES -->
      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-content">
            <div class="welcome-icon">
              ✦
            </div>
            <h1>
              How can I help you?
            </h1>
            <p>
              Ask me anything — coding, learning,
              writing, planning, ideas, or everyday questions.
            </p>
          </div>
        </div>
      </div>
      <!-- INPUT -->
      <div class="input-wrapper">
        <div class="input-container">
          <input
            id="messageInput"
            type="text"
            placeholder="Message Aira..."
            autocomplete="off"
          />
          <button
            class="send-button"
            id="sendButton"
            aria-label="Send message"
          >
            ➤
          </button>
        </div>
        <div class="disclaimer">
          Aira can make mistakes. Check important information.
        </div>
      </div>
    </main>
  </div>
  <script>
    const API_URL =
      "https://aira-ai-bot.onrender.com/api/chat";
    const messages =
      document.getElementById("messages");
    const input =
      document.getElementById("messageInput");
    const sendButton =
      document.getElementById("sendButton");
    const welcome =
      document.getElementById("welcome");
    const newChat =
      document.getElementById("newChat");
    // Add a message
    function addMessage(text, type) {
      // Remove welcome screen
      if (welcome) {
        welcome.remove();
      }
      const row =
        document.createElement("div");
      row.className =
        "message-row " + type;
      const avatar =
        document.createElement("div");
      avatar.className =
        "avatar";
      avatar.textContent =
        type === "user" ? "👤" : "✦";
      const bubble =
        document.createElement("div");
      bubble.className =
        "bubble";
      bubble.textContent =
        text;
      row.appendChild(avatar);
      row.appendChild(bubble);
      messages.appendChild(row);
      messages.scrollTop =
        messages.scrollHeight;
      return row;
    }
    // Typing indicator
    function addTyping() {
      if (welcome) {
        welcome.remove();
      }
      const row =
        document.createElement("div");
      row.className =
        "message-row ai";
      row.id =
        "typingMessage";
      const avatar =
        document.createElement("div");
      avatar.className =
        "avatar";
      avatar.textContent =
        "✦";
      const bubble =
        document.createElement("div");
      bubble.className =
        "bubble";
      bubble.innerHTML = `
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;
      row.appendChild(avatar);
      row.appendChild(bubble);
      messages.appendChild(row);
      messages.scrollTop =
        messages.scrollHeight;
    }
    // Remove typing
    function removeTyping() {
      const typing =
        document.getElementById(
          "typingMessage"
        );
      if (typing) {
        typing.remove();
      }
    }
    // Send message
    async function sendMessage() {
      const message =
        input.value.trim();
      if (!message) {
        return;
      }
      addMessage(
        message,
        "user"
      );
      input.value = "";
      input.disabled = true;
      sendButton.disabled = true;
      addTyping();
      try {
        const response =
          await fetch(API_URL, {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              message: message
            })
          });
        const data =
          await response.json();
        removeTyping();
        if (!response.ok) {
          throw new Error(
            data.error ||
            "AI response failed"
          );
        }
        addMessage(
          data.reply ||
          "No response received.",
          "ai"
        );
      } catch (error) {
        console.error(
          "Aira Error:",
          error
        );
        removeTyping();
        addMessage(
          "Sorry, AI response nahi aa paya. Please try again.",
          "ai"
        );
      } finally {
        input.disabled = false;
        sendButton.disabled = false;
        input.focus();
      }
    }
    // Send button
    sendButton.addEventListener(
      "click",
      sendMessage
    );
    // Enter to send
    input.addEventListener(
      "keydown",
      function(event) {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          sendMessage();
        }
      }
    );
    // New chat
    newChat.addEventListener(
      "click",
      function() {
        messages.innerHTML = `
          <div class="welcome" id="welcome">
            <div class="welcome-content">
              <div class="welcome-icon">
                ✦
              </div>
              <h1>
                How can I help you?
              </h1>
              <p>
                Ask me anything — coding, learning,
                writing, planning, ideas, or everyday questions.
              </p>
            </div>
          </div>
        `;
        input.focus();
      }
    );
    // Focus input on page load
    input.focus();
  </script>
</body>
</html>
