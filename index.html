<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aira AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      background: white;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }
    .header {
      padding: 18px;
      background: #111827;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }
    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .message {
      margin-bottom: 15px;
      padding: 12px 15px;
      border-radius: 12px;
      max-width: 80%;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }
    .ai {
      background: #eeeeee;
      color: #111;
      margin-right: auto;
    }
    .input-area {
      display: flex;
      padding: 15px;
      border-top: 1px solid #ddd;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    button {
      padding: 13px 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      🤖 Aira AI Assistant
    </div>
    <div class="messages" id="messages">
      <div class="message ai">
        Hello! I'm Aira, your AI assistant. How can I help you?
      </div>
    </div>
    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="Ask me anything..."
        autocomplete="off"
      />
      <button id="sendButton">
        Send
      </button>
    </div>
  </div>
  <script>
    // Your Render AI backend
    const API_URL =
      "https://aira-ai-bot.onrender.com/api/chat";
    const messages =
      document.getElementById("messages");
    const input =
      document.getElementById("messageInput");
    const button =
      document.getElementById("sendButton");
    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, "user");
      input.value = "";
      button.disabled = true;
      button.textContent = "Thinking...";
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(
            data.error || "Something went wrong"
          );
        }
        addMessage(data.reply, "ai");
      } catch (error) {
        console.error(error);
        addMessage(
          "Sorry, AI response nahi aa paya. Please try again.",
          "ai"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Send";
        input.focus();
      }
    }
    button.addEventListener(
      "click",
      sendMessage
    );
    input.addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      }
    );
  </script>
</body>
</html>
